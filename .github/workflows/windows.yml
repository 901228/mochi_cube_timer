# Builds apps/gui for Windows, zipped.
name: Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Side by side, so the relative path dependencies on mochi_ui and
      # mochi_cube resolve as they do locally.
      - uses: actions/checkout@v4
        with:
          path: mochi_cube_timer
      - uses: actions/checkout@v4
        with:
          repository: 901228/mochi_ui
          path: mochi_ui
      - uses: actions/checkout@v4
        with:
          repository: 901228/mochi_cube
          path: mochi_cube

      - id: fvm
        run: >-
          echo "flutter=$(jq -r .flutter mochi_cube_timer/.fvmrc)"
          >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - name: Build
        working-directory: mochi_cube_timer/apps/gui
        shell: bash
        run: |
          flutter build windows --release
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../mochi_timer-windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: mochi_cube_timer-windows
          path: mochi_cube_timer/apps/gui/build/mochi_timer-windows.zip
          retention-days: 7
