name: mochi_cube_timer_gui
description: "A gui application for mochi cube timer."
publish_to: "none"

resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.9

  characters: ^1.4.1
  collection: ^1.19.1

  go_router: ^18.0.0
  # forui: ^0.26.0

  mochi_ui:
    path: ../../../mochi_ui

  cube_timer:
    path: ../../packages/cube_timer

  drift:
  drift_flutter: ^0.3.1

  flutter_bloc: ^9.1.1
  stream_transform: ^2.1.2

  flutter_svg: ^2.3.0

  file_picker: ^13.1.0
  csv: ^8.0.0

  fl_chart: ^1.2.0
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: false
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  background_color_ios: "#EFF1F5"

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#EFF1F5"
    theme_color: "#EFF1F5"

  windows:
    generate: false
    image_path: "assets/icon/icon.png"
    icon_size: 256

  macos:
    generate: false
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/tables/
    - assets/cube_icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa/Comfortaa-Light.ttf
          weight: 300
        - asset: assets/fonts/Comfortaa/Comfortaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Comfortaa/Comfortaa-Medium.ttf
          weight: 500
        - asset: assets/fonts/Comfortaa/Comfortaa-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Comfortaa/Comfortaa-Bold.ttf
          weight: 700
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik/Rubik-Black.ttf
          weight: 900
